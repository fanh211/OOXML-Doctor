[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ooxml-doctor"
version = "0.1.0.dev0"
description = "Diagnose and repair damaged PPTX; every diagnostic carries an ECMA-376 / ISO-IEC 29500 clause ID"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
keywords = ["pptx", "ooxml", "ecma-376", "iso-29500", "repair", "validator", "powerpoint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Education",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["lxml>=4.9"]

[project.optional-dependencies]
dev = ["build", "pyinstaller>=6.0"]

[project.urls]
Homepage = "https://example.invalid/ooxml-doctor"
Changelog = "https://example.invalid/ooxml-doctor/CHANGELOG.md"

[project.scripts]
ooxml-doctor = "ooxml_doctor.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ooxml_doctor = ["NOTICE.txt", "schemas/*.xsd", "schemas/README.md"]
